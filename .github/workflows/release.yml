# Publishes a release for a version tag (v*): builds the compiler with the previous
# release as the seed, checks the stage 1 / stage 2 fixpoint, runs the tests, and
# attaches pst-linux-x86_64.tar.gz (`pst`, `units/` and `docs/`).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build the compiler
        run: scripts/bootstrap.sh
      - name: Test
        run: build/pst run tests/Run.pst
      - name: Package
        run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/pst-linux-x86_64.tar.gz --generate-notes
