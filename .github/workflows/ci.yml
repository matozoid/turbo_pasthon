# Builds the compiler with the latest release as the seed and runs the tests.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build the compiler
        run: scripts/bootstrap.sh
      - name: Test
        run: PST=build/pst python3 -m unittest discover -s tests -t .
